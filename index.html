<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050208">
<title>Marvels HC — بسته شد</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #050208;
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ─── Background Layers ─── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .bg-base {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(230, 36, 41, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(255, 184, 0, 0.15) 0%, transparent 55%),
      linear-gradient(180deg, #0a0a12 0%, #05050a 40%, #000 100%);
  }

  .bg-grid {
    opacity: 0.10;
    background-image:
      linear-gradient(rgba(230, 36, 41, 0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230, 36, 41, 0.4) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 60%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 60%, #000 20%, transparent 80%);
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 64px 64px; }
  }

  .bg-vignette {
    background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0, 0, 0, 0.9) 100%);
  }

  /* ─── Floating Orbs ─── */
  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    filter: blur(60px);
    opacity: 0.5;
  }

  .orb-1 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(230, 36, 41, 0.6), transparent 70%);
    top: -80px;
    left: -80px;
    animation: float1 12s ease-in-out infinite;
  }

  .orb-2 {
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255, 184, 0, 0.4), transparent 70%);
    bottom: -60px;
    right: -60px;
    animation: float2 15s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(40px, 30px); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-30px, -40px); }
  }

  /* ─── Main Card ─── */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    background: linear-gradient(160deg, rgba(30, 30, 40, 0.95), rgba(12, 12, 20, 0.98));
    border: 1px solid rgba(230, 36, 41, 0.35);
    border-radius: 28px;
    padding: 44px 32px 36px;
    text-align: center;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.9),
      0 0 60px rgba(230, 36, 41, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: cardIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #E62429, #FFB800, #E62429, transparent);
    box-shadow: 0 0 20px rgba(230, 36, 41, 0.8);
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(40px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* ─── Logo ─── */
  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #E62429, #8B0F14);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 40px;
    color: #fff;
    box-shadow:
      0 0 40px rgba(230, 36, 41, 0.7),
      0 0 80px rgba(230, 36, 41, 0.3),
      inset 0 2px 0 rgba(255, 255, 255, 0.25);
    position: relative;
    overflow: hidden;
    animation: logoPulse 3s ease-in-out infinite;
  }

  .logo::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    animation: shine 3s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(230, 36, 41, 0.7), 0 0 80px rgba(230, 36, 41, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.25); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(230, 36, 41, 0.9), 0 0 120px rgba(230, 36, 41, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.25); }
  }

  @keyframes shine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
  }

  /* ─── Typography ─── */
  .title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff 0%, #FFB800 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 15px;
    font-weight: 500;
    color: #8a8a95;
    line-height: 1.8;
    margin-bottom: 28px;
    letter-spacing: 0.2px;
  }

  .subtitle b {
    color: #FFB800;
    font-weight: 700;
  }

  /* ─── Divider ─── */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0;
    color: #5a5a65;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  }

  /* ─── Status Badge ─── */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(230, 36, 41, 0.12);
    border: 1px solid rgba(230, 36, 41, 0.4);
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    color: #FF4B52;
    margin-bottom: 24px;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FF4B52;
    box-shadow: 0 0 12px #FF4B52;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* ─── Info Grid ─── */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .info-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    transition: 0.2s;
  }

  .info-item:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 184, 0, 0.3);
    transform: translateY(-2px);
  }

  .info-item .icon {
    font-size: 20px;
    margin-bottom: 6px;
  }

  .info-item .label {
    font-size: 10.5px;
    color: #8a8a95;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* ─── Progress Bar ─── */
  .progress-wrap {
    margin-bottom: 28px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    color: #8a8a95;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .progress-label span:last-child {
    color: #FFB800;
  }

  .progress-bar {
    height: 8px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(255, 184, 0, 0.2);
  }

  .progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #8B0F14, #E62429, #FFB800);
    border-radius: 99px;
    box-shadow: 0 0 20px rgba(255, 184, 0, 0.6);
    animation: fillProgress 3s cubic-bezier(0.4, 0.2, 0.2, 1) 0.5s forwards;
  }

  @keyframes fillProgress {
    to { width: 68%; }
  }

  /* ─── Footer ─── */
  .footer {
    font-size: 11px;
    color: #5a5a65;
    letter-spacing: 2px;
    font-weight: 600;
    margin-top: 8px;
  }

  .footer b {
    color: #E62429;
  }

  /* ─── Responsive ─── */
  @media (max-width: 420px) {
    .card {
      padding: 36px 22px 30px;
    }
    .title {
      font-size: 25px;
    }
    .logo {
      width: 68px;
      height: 68px;
      font-size: 34px;
    }
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg bg-base"></div>
<div class="bg bg-grid"></div>
<div class="bg bg-vignette"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Card -->
<div class="card">
  <div class="logo">M</div>

  <h1 class="title">سایت بسته شد</h1>
  <p class="subtitle">
    Marvels HC فعلاً در دسترس نیست.<br>
    تا زمان <b>اطلاعات ثانوی</b>، سرویس غیرفعال خواهد بود.
  </p>

  <div class="status">
    <span class="dot"></span>
    OFFLINE
  </div>

  <div class="info-grid">
    <div class="info-item">
      <div class="icon">🔒</div>
      <div class="label">دسترسی بسته</div>
    </div>
    <div class="info-item">
      <div class="icon">⏳</div>
      <div class="label">در انتظار</div>
    </div>
    <div class="info-item">
      <div class="icon">📡</div>
      <div class="label">آفلاین</div>
    </div>
    <div class="info-item">
      <div class="icon">🛠️</div>
      <div class="label">در حال بررسی</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>وضعیت بازگشایی</span>
      <span>68%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="divider">MARVELS HC</div>

  <div class="footer">
    BUILT BY <b>PARHAM.KH</b>
  </div>
</div>

</body>
</html>
